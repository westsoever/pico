name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
      - 'index.html'
      - 'app-icon.svg'
      - 'favicon.svg'
      - 'apple-touch-icon.png'
      - 'manifest.webmanifest'
      - '.nojekyll'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Build for GitHub Pages
        env:
          VITE_BASE: /pico/
        run: |
          npm run build
          mv dist/index.dev.html dist/index.html

      - name: Publish built site to repo root and docs
        run: |
          rm -rf docs assets
          cp -r dist docs
          cp -r dist/assets assets
          cp dist/index.html index.html
          cp dist/app-icon.svg dist/favicon.svg dist/apple-touch-icon.png dist/manifest.webmanifest .
          touch .nojekyll docs/.nojekyll

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Deploy site to GitHub Pages
          file_pattern: |
            index.html
            assets/**
            docs/**
            app-icon.svg
            favicon.svg
            apple-touch-icon.png
            manifest.webmanifest
            .nojekyll

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
